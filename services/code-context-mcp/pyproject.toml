[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "agent-x-code-context-mcp"
version = "0.1.0"
description = "Project and baseline scoped CodeGraph MCP adapter"
requires-python = ">=3.12"
dependencies = ["mcp>=1.30,<2"]
[project.scripts]
code-context-mcp = "code_context.server:main"
[tool.setuptools.packages.find]
include = ["code_context*"]
[tool.setuptools.package-data]
code_context = ["bridge.mjs"]
